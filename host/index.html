<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host 主应用</title>
  <style>
    /* ===== 关键 CSS 内联 =====
       首屏占位的一切样式必须自包含：尺寸、行高、字号全部写死，
       不继承 body（global.less 经 JS 注入，到达前继承值会变，
       任何继承属性都会表现为占位符"跳变/漂移"）。 */
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f5f5f5;
    }
    .boot-loading {
      box-sizing: border-box;
      height: 100%;              /* 用 100% 而非 100vh，配合 margin:0 不产生滚动条 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 22px;         /* 行高写死，不继承 */
      font-family: system-ui, sans-serif;
      color: #8c8c8c;
    }
    .boot-logo {
      height: 56px;              /* 行盒高度写死：emoji 行高不受晚到样式影响 */
      font-size: 40px;
      line-height: 56px;
    }
    .boot-spinner {
      box-sizing: border-box;
      width: 24px;
      height: 24px;
      margin: 20px 0 12px;       /* 固定间距，不依赖 gap 的继承上下文 */
      border: 3px solid #e8e8e8;
      border-top-color: #1677ff;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- 首屏占位：JS 就绪前先显示，React 首次渲染时自动替换 -->
    <div class="boot-loading">
      <div class="boot-logo">🧩</div>
      <div class="boot-spinner"></div>
      <div>MF Admin 加载中…</div>
    </div>
  </div>
</body>
</html>
